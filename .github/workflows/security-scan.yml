name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  APP_DIR: app1/family-fund-app

jobs:
  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Audit locked Composer dependencies
        working-directory: ${{ env.APP_DIR }}
        run: composer audit --locked --format=plain

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Audit locked npm dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm audit --audit-level=moderate

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/laravel \
            --config p/php \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif \
            $APP_DIR

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on Semgrep findings
        if: steps.semgrep.outcome == 'failure'
        run: exit 1

  trivy-config:
    name: Trivy Config
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy config SARIF
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Fail on Trivy config findings
        if: steps.trivy.outcome == 'failure'
        run: exit 1

  security-route-guardrails:
    name: Security Route Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        working-directory: ${{ env.APP_DIR }}
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare test environment
        working-directory: ${{ env.APP_DIR }}
        run: |
          cp .env.dev .env
          php artisan key:generate --force

      - name: Run route security guardrail tests
        working-directory: ${{ env.APP_DIR }}
        run: php artisan test --filter=SecurityRouteAutomationTest

  trivy-filesystem:
    name: Trivy Filesystem
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          vuln-type: os,library

      - name: Upload Trivy filesystem SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Fail on Trivy filesystem findings
        if: steps.trivy.outcome == 'failure'
        run: exit 1

  trivy-image:
    name: Trivy Docker Image
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FamilyFund image
        working-directory: app1
        run: docker build -t familyfund-security-scan:ci .

      - name: Run Trivy image scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: familyfund-security-scan:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Fail on Trivy image findings
        if: steps.trivy.outcome == 'failure'
        run: exit 1

  sbom:
    name: Generate SBOM
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: familyfund-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: familyfund-sbom
          path: familyfund-sbom.cdx.json
          if-no-files-found: error

  osv-scanner:
    name: OSV Scanner
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile app1/family-fund-app/composer.lock
            --lockfile app1/family-fund-app/package-lock.json

  zap-baseline:
    name: OWASP ZAP Baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Build frontend assets
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare local environment
        run: cp app1/family-fund-app/.env.dev app1/family-fund-app/.env

      - name: Install PHP dependencies in container
        working-directory: app1
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm familyfund composer install --no-interaction --no-progress --prefer-dist

      - name: Boot FamilyFund stack
        working-directory: app1
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build familyfund mariadb mailhog quickchart

      - name: Prepare database
        working-directory: app1
        run: |
          for attempt in {1..60}; do
            if docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T mariadb mariadb-admin ping -h 127.0.0.1 -uroot -p123456 --silent; then
              break
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T familyfund php artisan migrate --force

      - name: Wait for app
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3001 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker ps
          docker compose -f app1/docker-compose.yml -f app1/docker-compose.dev.yml logs familyfund || true
          exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3001
          fail_action: false
          artifact_name: zap-baseline-report

      - name: Stop FamilyFund stack
        if: always()
        working-directory: app1
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
