name: Tests

# Runs the suite the same way it runs locally: inside the project's docker
# compose stack (familyfund + mariadb + quickchart + mailhog). The suite is
# tightly coupled to that environment -- it uses DatabaseTransactions (so the
# schema + a baseline dataset must be pre-loaded, not just an empty migrate), it
# calls the quickchart service at quickchart:3400, and PDF tests need
# wkhtmltopdf (baked into the familyfund image). Reproducing all that on a bare
# runner is brittle; booting the real stack mirrors testpool.sh, so "green
# locally => green in CI". This is the same compose-stack pattern
# security-scan.yml uses for its ZAP jobs.
#
# The baseline is built by `migrate:fresh --seed` with the synthetic
# Database\Seeders\TestBaselineSeeder (#78) -- NOT restored from a committed
# real-data dump. No real PII lives in the repo or the test DB.
#
# Tiering (the @group nightly convention from phpunit.xml):
#   * PR / push to main        -> fast tier only (--exclude-group=nightly)
#   * nightly schedule / manual -> fast tier + the slow @group nightly tests
#       (AclMatrixTest, PDFTest, SmokeTest, OperationsControllerTest)

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: app1/family-fund-app
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.dev.yml
  # Self-consistent throwaway creds for the ephemeral CI DB: the app connects as
  # root (dev compose sets DB_USERNAME=root), so FF_DB_PASSWORD must match
  # FF_DB_ROOT_PASSWORD. No real secrets involved.
  FF_DB_ROOT_PASSWORD: ci-secret
  FF_DB_PASSWORD: ci-secret
  FF_DB_USER_PASSWORD: ci-secret

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Build frontend assets
        # Built on the host (mounted into the container via ./family-fund-app:/app).
        # vite@^6 satisfies laravel-vite-plugin@^1.0's peer range (ED-0011), so a
        # plain `npm ci` resolves cleanly -- no --legacy-peer-deps needed.
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare .env
        run: cp ${{ env.APP_DIR }}/.env.example ${{ env.APP_DIR }}/.env

      - name: Install PHP dependencies (in container)
        working-directory: app1
        run: $COMPOSE run --rm familyfund composer install --no-interaction --no-progress --prefer-dist

      - name: Boot compose stack
        working-directory: app1
        run: $COMPOSE up -d --build familyfund mariadb quickchart mailhog

      - name: Wait for DB
        working-directory: app1
        run: |
          for i in $(seq 1 60); do
            if $COMPOSE exec -T mariadb mariadb-admin ping -h127.0.0.1 -uroot -p"$FF_DB_ROOT_PASSWORD" --silent; then
              break
            fi
            sleep 2
          done

      - name: Generate app key
        working-directory: app1
        run: $COMPOSE exec -T familyfund php artisan key:generate --force

      - name: Build synthetic test baseline (migrate + seed)
        # DatabaseTransactions needs the schema + a baseline dataset pre-loaded.
        # Migrate a fresh DB and run the synthetic TestBaselineSeeder instead of
        # restoring a committed real-data dump (#78). FF_SYNTHETIC_BASELINE=1
        # makes the dev-funds fixture migration skip its real-data payload. Then
        # assert the baseline actually loaded.
        working-directory: app1
        run: |
          $COMPOSE exec -T -e FF_SYNTHETIC_BASELINE=1 familyfund \
            php artisan migrate:fresh --seed --seeder='Database\Seeders\TestBaselineSeeder' --force
          $COMPOSE exec -T mariadb mariadb -uroot -p"$FF_DB_ROOT_PASSWORD" familyfund_dev \
            -N -e "SELECT CONCAT('baseline users rows: ', COUNT(*)) FROM users;"

      - name: Run fast suite
        working-directory: app1
        run: $COMPOSE exec -T familyfund php artisan test --exclude-group=nightly

      - name: Run nightly suite
        # The slow @group nightly tests, only on the nightly schedule / manual run.
        # phpunit.xml excludes this group by default, so --group=nightly opts in.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: app1
        run: $COMPOSE exec -T familyfund php artisan test --group=nightly

      - name: Tear down stack
        if: always()
        working-directory: app1
        run: $COMPOSE down -v
