services:
  mariadb:
    image: mariadb:lts
    environment:
      - ALLOW_EMPTY_PASSWORD=no

  familyfund:
    tty: true
    build: .
    environment:
      - DB_HOST=${FF_DB_HOST:-mariadb}
    depends_on:
      - mariadb
    extra_hosts:
      - noreply.domain.com:127.0.0.1
    volumes:
      - ./family-fund-app:/app
      - ./family-fund-app/docker_tmp:/tmp

  # Mailpit: arm64-native, drop-in MailHog replacement.
  # Service key kept as "mailhog" so env overrides + MAIL_HOST=mailhog still resolve.
  # Same ports as MailHog: 1025 (SMTP), 8025 (web UI).
  mailhog:
    image: axllent/mailpit:latest
    logging:
      driver: 'none'
    restart: on-failure
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

  quickchart:
    image: ianw/quickchart
    restart: on-failure
